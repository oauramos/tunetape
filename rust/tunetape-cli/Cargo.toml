[package]
name = "tunetape-cli"
version = "0.10.0"
edition = "2021"
rust-version = "1.74"
description = "Command-line client for the tunetape daemon (docs/protocol.md)"
license = "MIT"
repository = "https://github.com/oauramos/tunetape"
readme = "README.md"
publish = false

[[bin]]
name = "tunetape-cli"
path = "src/main.rs"

[dependencies]
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
# preserve_order: `--json` prints results with the daemon's key order.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
